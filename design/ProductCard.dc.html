<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>@keyframes tq-spin{to{transform:rotate(360deg)}} a{color:#1B1A18} a:hover{color:#5C5955}</style>
</helmet>
<div style="font-family:'Instrument Sans',Helvetica,Arial,sans-serif;color:#1B1A18;display:flex;flex-direction:column;gap:12px;width:100%;position:relative">
  <div style="position:relative;aspect-ratio:{{ imgRatio }};background:#F4F3F1;border-radius:4px;overflow:hidden;border:1px solid {{ hoverBorder }};transition:border-color 200ms cubic-bezier(.2,0,0,1)">
    <sc-if value="{{ hasImage }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(135deg,#EFEEEB 0 8px,#E8E6E2 8px 16px);display:flex;align-items:center;justify-content:center;opacity:{{ imgOpacity }};transform:{{ imgScale }};transition:transform 400ms cubic-bezier(.2,0,0,1)">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8A867F;letter-spacing:.02em">{{ imgLabel }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ noImage }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#8A867F">
        <div style="width:28px;height:28px;border:1.5px solid #C9C6C0;border-radius:4px"></div>
        <span style="font-size:12px">No image</span>
      </div>
    </sc-if>
    <sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:12px;left:12px;font-size:12px;font-weight:500;line-height:20px;padding:0 8px;border-radius:4px;background:{{ badgeBg }};color:{{ badgeFg }};letter-spacing:.01em">{{ badge }}</span>
    </sc-if>
    <sc-if value="{{ multiDots }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:4px">
        <span style="width:6px;height:6px;border-radius:50%;background:#1B1A18"></span><span style="width:6px;height:6px;border-radius:50%;background:#C9C6C0"></span><span style="width:6px;height:6px;border-radius:50%;background:#C9C6C0"></span>
      </div>
    </sc-if>
    <sc-if value="{{ showQA }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:12px;right:12px;bottom:12px;opacity:{{ qaOpacity }};transform:{{ qaShift }};transition:opacity 200ms cubic-bezier(.2,0,0,1),transform 200ms cubic-bezier(.2,0,0,1)">
        <button style="width:100%;height:40px;border:1px solid {{ qaBorder }};background:{{ qaBg }};color:{{ qaFg }};font:inherit;font-size:14px;font-weight:500;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer">
          <sc-if value="{{ qaIsLoading }}" hint-placeholder-val="{{ false }}"><span style="width:14px;height:14px;border:2px solid #C9C6C0;border-top-color:#1B1A18;border-radius:50%;animation:tq-spin 800ms linear infinite"></span></sc-if>
          <sc-if value="{{ qaIsSuccess }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:14px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px)"></span></sc-if>
          <span>{{ qaLabel }}</span>
        </button>
      </div>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
    <sc-if value="{{ hasVendor }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;line-height:16px;color:#8A867F;letter-spacing:.04em;text-transform:uppercase">{{ vendor }}</span></sc-if>
    <a href="#" style="font-size:15px;line-height:22px;font-weight:500;color:{{ titleColor }};text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty">{{ title }}</a>
    <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums">
      <span style="font-size:15px;line-height:22px;font-weight:500;color:{{ priceColor }}">{{ price }}</span>
      <sc-if value="{{ hasCompare }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;line-height:22px;color:#8A867F;text-decoration:line-through">{{ comparePrice }}</span></sc-if>
      <sc-if value="{{ unavailable }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;line-height:22px;color:#8A867F">Unavailable</span></sc-if>
    </div>
    <sc-if value="{{ hasSwatches }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:6px;align-items:center;padding-top:4px">
        <sc-for list="{{ swatches }}" as="s" hint-placeholder-count="3">
          <span style="width:16px;height:16px;border-radius:50%;background:{{ s.c }};box-shadow:0 0 0 1px rgba(27,26,24,.15) inset;outline:{{ s.ring }};outline-offset:2px"></span>
        </sc-for>
        <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#8A867F;margin-left:2px">{{ moreLabel }}</span></sc-if>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:460},
&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Product title&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;vendor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;$48.00&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;comparePrice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;badge&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;Sale&quot;,&quot;Sold out&quot;,&quot;New&quot;],&quot;tsType&quot;:&quot;'' | 'Sale' | 'Sold out' | 'New'&quot;},
&quot;image&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;4:5&quot;,&quot;options&quot;:[&quot;4:5&quot;,&quot;1:1&quot;,&quot;3:4&quot;,&quot;3:2&quot;,&quot;none&quot;],&quot;tsType&quot;:&quot;string&quot;},
&quot;swatches&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string | string[]&quot;},
&quot;quickAdd&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;idle&quot;,&quot;loading&quot;,&quot;success&quot;],&quot;tsType&quot;:&quot;'none' | 'idle' | 'loading' | 'success'&quot;},
&quot;hover&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;multiImage&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;unavailable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props; const badge = p.badge || ''; const qa = p.quickAdd || 'none'; const img = p.image || '4:5';
    let sw = p.swatches || []; if (typeof sw === 'string') sw = sw.split(',').map(s => s.trim()).filter(Boolean);
    const max = 4; const shown = sw.slice(0, max);
    const soldOut = badge === 'Sold out'; const hover = !!p.hover;
    const ratio = { '1:1': '1/1', '3:4': '3/4', '4:5': '4/5', '16:9': '16/9', '3:2': '3/2' }[img] || '4/5';
    const qaSuccess = qa === 'success', qaLoading = qa === 'loading';
    return {
      hasBadge: !!badge, badge, badgeBg: badge === 'Sale' ? '#B3261E' : soldOut ? '#FFFFFF' : '#1B1A18', badgeFg: soldOut ? '#5C5955' : '#FFFFFF',
      hasImage: img !== 'none', noImage: img === 'none', imgRatio: ratio, imgLabel: (p.multiImage && hover) ? 'product image 2' : 'product image',
      hasVendor: !!p.vendor, vendor: p.vendor, title: p.title || 'Product title', price: p.price || '$48.00',
      hasCompare: !!p.comparePrice, comparePrice: p.comparePrice, priceColor: p.comparePrice ? '#B3261E' : '#1B1A18',
      unavailable: !!p.unavailable, titleColor: p.unavailable ? '#8A867F' : '#1B1A18',
      hasSwatches: shown.length > 0, swatches: shown.map((c, i) => ({ c, ring: i === 0 ? '1px solid #1B1A18' : 'none' })), hasMore: sw.length > max, moreLabel: '+' + (sw.length - max),
      showQA: qa !== 'none', qaOpacity: (hover || qaLoading || qaSuccess) ? 1 : 0, qaShift: (hover || qaLoading || qaSuccess) ? 'none' : 'translateY(4px)',
      qaLabel: qaLoading ? 'Adding…' : qaSuccess ? 'Added' : soldOut ? 'Sold out' : 'Quick add', qaIsLoading: qaLoading, qaIsSuccess: qaSuccess,
      qaBg: qaSuccess ? '#1B1A18' : '#FFFFFF', qaFg: qaSuccess ? '#FFFFFF' : soldOut ? '#8A867F' : '#1B1A18', qaBorder: qaSuccess ? '#1B1A18' : '#E6E4E0',
      imgOpacity: soldOut || p.unavailable ? 0.55 : 1, imgScale: hover && img !== 'none' && !p.multiImage ? 'scale(1.03)' : 'none',
      multiDots: !!p.multiImage, hoverBorder: hover ? '#C9C6C0' : '#E6E4E0'
    };
  }
}
</script>
</body>
</html>
